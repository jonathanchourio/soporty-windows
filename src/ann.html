<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="rtc.js"></script>
<script>
  (function(){
    var T = window.__TAURI__, marks = new SPMarks(document.getElementById('cv')), timer = 0;
    // Vigilante: si el técnico deja de marcar unos segundos, la capa desaparece sola.
    // Así, pase lo que pase, nunca se queda tapando la pantalla.
    function arm(){ clearTimeout(timer); timer = setTimeout(function(){ T.core.invoke('ann_hide'); }, 3000); }
    T.event.listen('ann', function (e) { marks.apply(e.payload); arm(); });
    // Candado: si esta capa recibe entrada del usuario es que NO es atravesable -> se cierra ya.
    ['mousemove','mousedown','wheel','keydown','touchstart'].forEach(function (ev) {
      window.addEventListener(ev, function () { T.core.invoke('ann_hide'); }, { passive: true });
    });
    arm();
    setTimeout(function(){ marks.draw(); }, 50);
  })();
</script>
</body>
</html>
