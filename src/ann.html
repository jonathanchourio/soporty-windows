<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;pointer-events:none}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="rtc.js"></script>
<script>
  (function(){
    var marks = new SPMarks(document.getElementById('cv'));
    window.__TAURI__.event.listen('ann', function (e) { marks.apply(e.payload); });
    // el canvas no tiene tamaño CSS hasta el primer layout: forzar un redibujo
    setTimeout(function(){ marks.draw(); }, 50);
  })();
</script>
</body>
</html>
