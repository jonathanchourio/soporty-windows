<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;font:14px/1.3 system-ui,Segoe UI,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;gap:10px;padding:0 12px;
    background:#B23D2B;color:#fff;border-radius:10px;border:2px solid #fff;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  .dot{width:11px;height:11px;border-radius:50%;background:#fff;flex:none;animation:p 1.3s infinite}
  @keyframes p{50%{opacity:.35}}
  .txt{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button{border:0;background:#fff;color:#B23D2B;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px}
  button:hover{background:#ffe9e4}
</style>
</head>
<body>
  <span class="dot"></span>
  <span class="txt">Un técnico está controlando tu equipo</span>
  <button id="stop">Detener</button>
<script>
  const invoke = window.__TAURI__.core.invoke;
  document.getElementById('stop').onclick = () => invoke('rc_stop');
  // La barra se puede arrastrar para moverla
  let drag=false,sx,sy;
  document.body.addEventListener('mousedown',e=>{ if(e.target.id!=='stop'){drag=true;sx=e.screenX;sy=e.screenY;} });
  addEventListener('mouseup',()=>drag=false);
</script>
</body>
</html>
