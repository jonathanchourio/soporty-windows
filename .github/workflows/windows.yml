# Compila el instalador de Windows (.exe) en los servidores de GitHub.
# Se ejecuta al subir cambios o desde Actions → «Compilar Windows» → Run workflow.
name: Compilar Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar Tauri CLI
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y "tauri-cli@^2.0"

      - name: Poner el número de versión
        shell: bash
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$V';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          echo "APPVER=$V" >> "$GITHUB_ENV"

      - name: Compilar instalador
        run: cargo tauri build

      - name: Preparar salida
        shell: bash
        run: |
          mkdir -p salida
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "salida/Soporty-${APPVER}-instalador.exe"

      - name: Entregar el instalador
        uses: actions/upload-artifact@v5
        with:
          name: soporty-windows-${{ env.APPVER }}
          path: salida/*.exe
          retention-days: 30
