# Compila la app de macOS en los servidores de GitHub.
# Genera un binario universal (Intel + Apple Silicon), sin firmar, y lo entrega
# como .app comprimida en .zip (evita el empaquetado .dmg, frágil en CI headless).
name: Compilar macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Preparar Rust (Intel + Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar Tauri CLI
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y "tauri-cli@^2.0"

      - name: Poner el número de versión
        shell: bash
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$V';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          echo "APPVER=$V" >> "$GITHUB_ENV"

      - name: Compilar app universal
        shell: bash
        run: |
          set -o pipefail
          if ! cargo tauri build --target universal-apple-darwin --bundles app 2>&1 | tee /tmp/build.log; then
            echo "::error::La compilación de macOS falló. Últimas líneas:"
            tail -25 /tmp/build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Empaquetar .app en .zip
        shell: bash
        run: |
          APPDIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP=$(ls -d "$APPDIR"/*.app | head -1)
          echo "App: $APP"
          mkdir -p salida
          ditto -c -k --keepParent "$APP" "salida/Soporty-${APPVER}-mac.zip"
          ls -lh salida

      - name: Entregar la app
        uses: actions/upload-artifact@v5
        with:
          name: soporty-mac-${{ env.APPVER }}
          path: salida/*.zip
          retention-days: 30
